# TiDB v8.5 生产环境拓扑模板（最小高可用配置）
# 3 TiDB + 3 TiKV + 3 PD + 1 TiFlash + 1 Monitor
# 适用：中等规模生产环境

global:
  user: "tidb"
  ssh_port: 22
  deploy_dir: "/tidb-deploy"
  data_dir: "/tidb-data"
  arch: "amd64"  # amd64 / arm64

monitored:
  node_exporter_port: 9100
  blackbox_exporter_port: 9115

server_configs:
  tidb:
    log.slow-threshold: 300
    binlog.enable: false
    binlog.ignore-error: false
  tikv:
    storage.reserve-space: "1GB"
    rocksdb.max-open-files: 10240
  pd:
    schedule.leader-schedule-limit: 4
    schedule.region-schedule-limit: 2048

tidb_servers:
  - host: 10.0.1.11
    port: 4000
    status_port: 10080
  - host: 10.0.1.12
    port: 4000
    status_port: 10080
  - host: 10.0.1.13
    port: 4000
    status_port: 10080

tikv_servers:
  - host: 10.0.1.21
    port: 20160
    status_port: 20180
    config:
      server.labels: { zone: "zone1", host: "host1" }
  - host: 10.0.1.22
    port: 20160
    status_port: 20180
    config:
      server.labels: { zone: "zone2", host: "host2" }
  - host: 10.0.1.23
    port: 20160
    status_port: 20180
    config:
      server.labels: { zone: "zone3", host: "host3" }

pd_servers:
  - host: 10.0.1.31
    client_port: 2379
    peer_port: 2380
  - host: 10.0.1.32
    client_port: 2379
    peer_port: 2380
  - host: 10.0.1.33
    client_port: 2379
    peer_port: 2380

tiflash_servers:
  - host: 10.0.1.41
    tcp_port: 9000
    http_port: 8123
    flash_service_port: 3930
    flash_proxy_port: 20170
    flash_proxy_status_port: 20292
    metrics_port: 8234
    learner_config:
      log.level: "info"

monitoring_servers:
  - host: 10.0.1.51
    port: 9090

grafana_servers:
  - host: 10.0.1.51
    port: 3000

alertmanager_servers:
  - host: 10.0.1.51
    web_port: 9093
    cluster_port: 9094
